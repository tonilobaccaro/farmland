[project]
name = "evidence"
version = "0.1.0"
description = "Evidence-gathering harness for farmland listing sites"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]",
    "curl_cffi",
    "playwright",
    "selectolax",
    "lxml",
    "extruct",
    "protego",
    "tldextract",
    "w3lib",
    "jsonpath-ng",
    "pdfplumber",
    "jinja2",
    "pandas",
    "pydantic>=2",
    "typer",
    "rich",
    "pyyaml",
    "dnspython",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
evidence = "evidence.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: typer's canonical style is `param: T = typer.Option(...)` in the
# function signature; that's a false positive here, not a real "call in a
# mutable default" bug.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
